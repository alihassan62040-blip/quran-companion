<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#071b14">
<title>Quran Companion</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Nastaliq Urdu",sans-serif;
  background:#071b14;
  color:#f4f8f5;
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{
  min-height:100vh;
  padding-bottom:75px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#0b241b;
  border-bottom:1px solid #1b4434;
}

.header-inner{
  max-width:900px;
  margin:auto;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.header-inner h1,
.header-inner h2{
  margin:0;
  text-align:center;
}

.header-btn{
  background:#12382a;
  color:white;
  border:1px solid #285844;
  border-radius:12px;
  padding:9px 13px;
}

main{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:#0d281f;
  border:1px solid #1d4938;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

.home-title{
  text-align:center;
  padding:30px 10px;
}

.home-title h1{
  font-size:34px;
  margin:10px 0;
}

.home-title p{
  color:#b9cbc2;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.menu-btn{
  min-height:110px;
  border:1px solid #255540;
  background:#0d281f;
  color:white;
  border-radius:18px;
  padding:15px;
}

.menu-btn span{
  display:block;
  font-size:34px;
  margin-bottom:8px;
}

.menu-btn small{
  color:#c8d8d0;
}

.search{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.search input{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #315b49;
  background:#081c15;
  color:white;
  outline:none;
}

.surah-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.surah-card{
  width:100%;
  border:1px solid #224d3b;
  background:#0d281f;
  color:white;
  border-radius:15px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:right;
}

.surah-card:hover{
  background:#123529;
}

.surah-number{
  min-width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#174b37;
  color:#dceee5;
}

.surah-name{
  flex:1;
}

.surah-name strong{
  display:block;
  font-size:18px;
}

.surah-name small{
  display:block;
  margin-top:4px;
  color:#9eb4a9;
}

.loading{
  text-align:center;
  padding:30px;
  color:#b9cbc2;
}

.reader-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.reader-top h2{
  margin:0;
}

.settings{
  background:#0d281f;
  border:1px solid #1d4938;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
}

.settings label{
  display:block;
  margin-bottom:14px;
}

.settings input,
.settings select{
  width:100%;
  margin-top:8px;
}

.ayah-card{
  background:#0c251d;
  border:1px solid #1d4938;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

.ayah-card.current{
  border-color:#7dbb9c;
  box-shadow:0 0 0 2px rgba(125,187,156,.15);
}

.ayah-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.ayah-number{
  background:#174b37;
  min-width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.actions{
  display:flex;
  gap:7px;
}

.actions button,
.audio-controls button{
  border:1px solid #315b49;
  background:#12382a;
  color:white;
  border-radius:10px;
  padding:9px 12px;
}

.arabic{
  font-size:32px;
  line-height:2.25;
  text-align:right;
  margin-bottom:18px;
}

.translation{
  background:#102f25;
  border-radius:13px;
  padding:15px;
  line-height:2;
  color:#d8e6df;
}

.translation-title{
  color:#83c7a3;
  font-weight:bold;
  margin-bottom:6px;
}

.tafseer-btn{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:1px solid #315b49;
  background:#12382a;
  color:white;
  border-radius:12px;
}

.tafseer{
  margin-top:10px;
  background:#081c15;
  border-radius:12px;
  padding:14px;
  line-height:2;
  color:#c9d8d1;
}

.audio-player{
  position:fixed;
  bottom:65px;
  left:50%;
  transform:translateX(-50%);
  width:min(880px,94%);
  z-index:30;
  background:#0b241b;
  border:1px solid #37664f;
  border-radius:17px;
  padding:12px;
  box-shadow:0 10px 30px #0008;
}

.audio-title{
  text-align:center;
  margin-bottom:8px;
}

.audio-controls{
  display:flex;
  justify-content:center;
  gap:10px;
}

.audio-progress{
  width:100%;
  margin-top:10px;
}

.audio-time{
  display:flex;
  justify-content:space-between;
  direction:ltr;
  color:#9fb6aa;
  font-size:12px;
}

.primary{
  width:100%;
  padding:13px;
  border:0;
  border-radius:13px;
  background:#216c4d;
  color:white;
}

.message{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  z-index:100;
  background:#173c2d;
  border:1px solid #47735c;
  padding:12px 18px;
  border-radius:12px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:50;
  height:65px;
  background:#091c15;
  border-top:1px solid #234b3a;
  display:flex;
  justify-content:center;
}

.bottom-nav button{
  flex:1;
  max-width:180px;
  background:none;
  color:#b9cbc2;
  border:0;
}

.bottom-nav span,
.bottom-nav small{
  display:block;
}

.bottom-nav span{
  font-size:21px;
}

.bottom-nav small{
  margin-top:3px;
}

@media(max-width:600px){
  main{padding:12px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .arabic{font-size:28px}
  .home-title h1{font-size:28px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header-inner">
    <button class="header-btn" id="backBtn" type="button" onclick="goHome()">⌂</button>
    <h2 id="headerTitle">Quran Companion</h2>
    <button class="header-btn" id="settingsBtn" type="button" onclick="toggleSettings()">⚙️</button>
  </div>
</header>

<main>

<section id="homeScreen">
  <div class="home-title">
    <div style="font-size:55px">📖</div>
    <h1>Quran Companion</h1>
    <p>قرآن، ترجمہ، تلاوت اور تفسیر</p>
  </div>

  <div class="grid">
    <button class="menu-btn" type="button" onclick="openQuran()">
      <span>📖</span>قرآن
    </button>

    <button class="menu-btn" type="button" onclick="continueReading()">
      <span>▶️</span>جاری رکھیں
    </button>

    <button class="menu-btn" type="button" onclick="openDuas()">
      <span>🤲</span>دعائیں
    </button>

    <button class="menu-btn" type="button" onclick="openTasbeeh()">
      <span>📿</span>تسبیح
    </button>
  </div>
</section>

<section id="quranScreen" class="hidden">
  <div class="card">
    <div class="search">
      <input id="surahSearch" name="surahSearch" type="search"
             placeholder="سورت تلاش کریں..." oninput="filterSurahs()">
    </div>
  </div>

  <div id="surahList" class="surah-list">
    <div class="loading">سورتیں لوڈ ہو رہی ہیں...</div>
  </div>
</section>

<section id="readerScreen" class="hidden">

  <div class="reader-top">
    <button class="header-btn" type="button" onclick="backToSurahs()">← سورتیں</button>
    <h2 id="readerTitle">قرآن</h2>
    <button class="header-btn" type="button" onclick="toggleSettings()">⚙️</button>
  </div>

  <div id="readerSettings" class="settings hidden">

    <label>
      عربی فونٹ سائز
      <input id="fontSize" name="fontSize" type="range"
             min="22" max="50" value="32"
             oninput="changeArabicSize(this.value)">
    </label>

    <label>
      ترجمہ
      <select id="translationSelect" name="translationSelect"
              onchange="changeTranslation(this.value)">
        <option value="ur.jalandhry">اردو — جالندھری</option>
        <option value="en.sahih">English — Sahih International</option>
      </select>
    </label>

  </div>

  <div id="ayahContainer">
    <div class="loading">قرآن لوڈ ہو رہا ہے...</div>
  </div>

</section>

<section id="duasScreen" class="hidden">
  <div class="card">
    <h2>🤲 مسنون دعائیں</h2>
  </div>
  <div id="duasList"></div>
</section>

<section id="tasbeehScreen" class="hidden">
  <div class="card" style="text-align:center">
    <h2>📿 تسبیح</h2>
    <div style="font-size:55px;margin:25px" id="tasbeehCount">0</div>

    <button class="primary" type="button" onclick="countTasbeeh()">
      ذکر کریں
    </button>

    <br><br>

    <button class="header-btn" type="button" onclick="resetTasbeeh()">
      ری سیٹ
    </button>
  </div>
</section>

</main>

<div id="audioPlayer" class="audio-player hidden">

  <div id="audioTitle" class="audio-title">آیت</div>

  <div class="audio-controls">
    <button type="button" onclick="previousAudio()">⏮</button>
    <button id="mainPlay" type="button" onclick="toggleMainAudio()">▶️</button>
    <button type="button" onclick="nextAudio()">⏭</button>
  </div>

  <input id="audioProgress" name="audioProgress"
         class="audio-progress"
         type="range" min="0" max="100" value="0"
         oninput="seekAudio(this.value)">

  <div class="audio-time">
    <span id="totalTime">0:00</span>
    <span id="currentTime">0:00</span>
  </div>

</div>

<nav class="bottom-nav">
  <button type="button" onclick="goHome()">
    <span>⌂</span><small>ہوم</small>
  </button>

  <button type="button" onclick="openQuran()">
    <span>📖</span><small>قرآن</small>
  </button>

  <button type="button" onclick="openDuas()">
    <span>🤲</span><small>دعائیں</small>
  </button>

  <button type="button" onclick="openTasbeeh()">
    <span>📿</span><small>ذکر</small>
  </button>
</nav>

</div>

<script src="./script.js"></script>

</body>
</html>
