<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1912">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./launchericon-512x512.png">
<link rel="apple-touch-icon" href="./launchericon-512x512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<title>Quran Companion</title>
</head>
<body>

<header>
  <div class="header">
    <button class="btn" onclick="goHome()">⌂</button>
    <h2 id="headerTitle">قرآن کریم</h2>
    <button class="btn" onclick="toggleSettings()">⚙️</button>
  </div>
</header>

<main>

<section id="home">
  <div class="home">
    <div class="home-icon">📖</div>
    <h1>قرآن کریم</h1>
    <p>عربی متن، اردو ترجمہ، تفسیر اور تلاوت</p>
  </div>
  <div class="grid">
    <button class="menu" onclick="openQuran()"><span>📖</span>سورتیں</button>
    <button class="menu" onclick="continueReading()"><span>▶️</span>جاری رکھیں</button>
  </div>
</section>

<section id="quran" class="hidden">
  <div class="card">
    <div class="search"><input id="surahSearch" placeholder="سورت تلاش کریں..." oninput="filterSurahs()"></div>
  </div>
  <div id="surahList"><div class="loading">سورتیں لوڈ ہو رہی ہیں...</div></div>
</section>

<section id="reader" class="hidden">
  <div class="reader-top">
    <button class="btn" onclick="backToSurahs()">← سورتیں</button>
    <h2 id="readerTitle">قرآن</h2>
    <button class="btn" onclick="toggleSettings()">⚙️</button>
  </div>
  <div id="settings" class="settings hidden">
    <label>عربی فونٹ سائز
      <input id="fontSize" type="range" min="24" max="54" value="36" oninput="changeArabicSize(this.value)">
    </label>
    <label>ترجمہ
      <select id="translationSelect" onchange="changeTranslation(this.value)">
        <option value="ur.jalandhry">اردو — جالندھری</option>
        <option value="ur.maududi">اردو — مودودی</option>
        <option value="en.sahih">English — Sahih International</option>
      </select>
    </label>
    <label>قاری
      <select id="reciterSelect" onchange="changeReciter(this.value)">
        <option value="ar.alafasy">مشاری العفاسی</option>
        <option value="ar.abdulbasitmurattal">عبدالباسط</option>
        <option value="ar.husary">الحصری</option>
      </select>
    </label>
  </div>
  <div id="ayahContainer"><div class="loading">قرآن لوڈ ہو رہا ہے...</div></div>
</section>

</main>

<div id="audioPlayer" class="audio hidden">
  <div id="audioTitle" class="audio-title">چل رہا ہے...</div>
  <audio id="audioEl" style="display:none"></audio>
  <input id="audioProgress" class="progress" type="range" min="0" max="100" value="0">
  <div class="times"><span id="audioCur">0:00</span><span id="audioDur">0:00</span></div>
  <div class="audio-buttons">
    <button onclick="prevAyah()">⏮</button>
    <button id="playPauseBtn" onclick="togglePlay()">⏸</button>
    <button onclick="nextAyah()">⏭</button>
    <button onclick="closeAudio()">✖</button>
  </div>
</div>

<div id="toast" class="message hidden"></div>

<script src="./script.js"></script>
</body>
</html>
